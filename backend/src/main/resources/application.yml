server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: veyra-backend

veyra:
  security:
    jwt-enabled: ${VEYRA_JWT_ENABLED:false}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  osm:
    geocode-url: ${NOMINATIM_GEOCODE_URL:https://nominatim.openstreetmap.org/search}
    route-url: ${OSRM_ROUTE_URL:https://router.project-osrm.org/route/v1}
    user-agent: ${OSM_USER_AGENT:Veyra/1.0 (https://github.com/vjagarwal1144-cloud/Veyra)}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:}
  train:
    base-url: ${TRAIN_API_BASE_URL:}
    api-key: ${TRAIN_API_KEY:}
    search-path: ${TRAIN_API_SEARCH_PATH:/trains/{number}/live}
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
